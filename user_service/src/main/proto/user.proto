syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.jhorgi.user_service.grpc";

package user;

service UserService {
  rpc ValidateCredentials (ValidateRequest) returns (ValidateResponse);
}

message ValidateRequest {
  string username = 1;
  string password = 2;
}

message ValidateResponse {
  bool valid = 1;
  string email = 2;
}